[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torchisotonic"
dynamic = ["version"]
description = "Batched isotonic regression for PyTorch tensors, fast on GPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lena Barretta" }]
requires-python = ">=3.10"
# The C++/CUDA operators are compiled on first use, which needs ninja and a C++ compiler.
dependencies = ["torch>=2.4", "ninja"]
keywords = ["pytorch", "torch", "isotonic-regression", "calibration", "pava", "cuda", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/LenaBarretta/torchisotonic"
Issues = "https://github.com/LenaBarretta/torchisotonic/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6",
    "numpy>=1.24",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]

# Develop and test against the small CPU-only torch build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.sdist]
# The sources, the tests (with docs/hull_prototype.py, which one of them checks), README and
# licence. notes/ is kept out of git through .git/info/exclude, which hatch does not read, so it
# is listed here too.
exclude = [
    "bench", "notebooks", "kaggle", "experiments", "examples", "cloud", ".github",
    "notes", "uv.lock",
]

[tool.hatch.version]
path = "src/torchisotonic/__init__.py"

[tool.pytest.ini_options]
addopts = "-q --cov=torchisotonic --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests", "docs"]
# tests/test_hull_prototype.py imports docs/hull_prototype.py by putting docs/ on sys.path.
mypy_path = "docs"

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
